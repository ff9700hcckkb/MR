<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>吃土專區</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="吃土專區">

<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#17202a; --mute:#6b7785; --line:#e4e8ee;
  --out:#d2453c; --in:#12856b; --accent:#2f4b7c; --chip:#eef1f5;
  --shadow:0 1px 2px rgba(23,32,42,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#12161c; --card:#1b2129; --ink:#e8ecf1; --mute:#8d99a8; --line:#2a323d;
    --out:#ef6a60; --in:#3fc19f; --accent:#8fb0ee; --chip:#252d38; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:none}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px; line-height:1.5; font-variant-numeric:tabular-nums;
}
.wrap{max-width:760px; margin:0 auto; padding:16px 14px 48px}
button,select,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* header */
.top{display:flex; align-items:baseline; gap:8px; margin-bottom:8px}
.upd{font-size:12px; color:var(--mute)}
.ctrl{display:flex; align-items:center; gap:8px; margin-bottom:14px}
.ctrl{position:relative}
.ctrl .monthbtn{flex:1}
.top h1{font-size:18px; margin:0; flex:1; font-weight:700}
.ico{border:1px solid var(--line); background:var(--card); border-radius:8px; height:34px; min-width:34px; padding:0 10px}
.ico:hover{background:var(--chip)}
.monthbtn{border:1px solid var(--line); background:var(--card); border-radius:8px; height:34px; padding:0 8px; font-weight:600}
#mpbk{position:fixed; inset:0; z-index:24}
#mp{position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:25; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; box-shadow:0 8px 28px rgba(0,0,0,.28)}
.mp-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.mp-head b{font-size:16px}
.mp-head button{border:1px solid var(--line); background:var(--bg); width:34px; height:32px; border-radius:8px; font-size:18px}
.mp-head button:disabled{opacity:.3}
.mp-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.mp-grid button{height:42px; border:1px solid var(--line); background:var(--bg); border-radius:10px; font-size:15px}
.mp-grid button.on{background:var(--ink); color:var(--card); border-color:var(--ink); font-weight:600}
.mp-grid button:disabled{opacity:.28; border-style:dashed}

/* summary */
.hero{background:var(--card); border-radius:14px; padding:18px 18px 14px; box-shadow:var(--shadow); border:1px solid var(--line)}
.hero .lbl{color:var(--mute); font-size:13px}
.hero .big{font-size:40px; font-weight:700; letter-spacing:-.5px; line-height:1.15; color:var(--out)}
.sub{display:flex; gap:0; margin-top:12px; border-top:1px solid var(--line); padding-top:12px}
.sub div{flex:1}
.sub div+div{border-left:1px solid var(--line); padding-left:14px}
.sub .v{font-size:19px; font-weight:650}
.pos{color:var(--in)} .neg{color:var(--out)}
.opt{display:flex; gap:14px; flex-wrap:wrap; margin:10px 2px 0; color:var(--mute); font-size:13px}
.opt label{display:flex; align-items:center; gap:6px; cursor:pointer}

/* sections */
section{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:12px; box-shadow:var(--shadow)}
section h2{font-size:14px; margin:0 0 10px; display:flex; justify-content:space-between; align-items:baseline; font-weight:650}
section h2 small{font-weight:400; color:var(--mute); font-size:12px}

/* tabs */
.tabbar{display:flex; gap:6px; margin-top:12px}
.tabbar button{flex:1; height:38px; border:1px solid var(--line); background:var(--card); border-radius:10px; font-size:14px; color:var(--mute); padding:0 4px; white-space:nowrap}
.tabbar button[data-tab="x"]{flex:0 0 44px}
.tabbar button.on{background:var(--ink); color:var(--card); border-color:var(--ink); font-weight:600}
.pane{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:8px; box-shadow:var(--shadow)}
.pane[hidden]{display:none}
.xsum{display:flex; align-items:baseline; gap:10px; margin-bottom:6px}
.xsum b{font-size:22px; color:var(--out)}
.xsum span{color:var(--mute); font-size:13px}
.pane .hint:empty{display:none}
.pane .hint b{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px}
.pane .hint span+span{margin-left:12px}
.pane .hint{display:block; font-size:12px; color:var(--mute); margin-bottom:10px}
/* category bars */
.cat{display:grid; grid-template-columns:64px 1fr auto; gap:10px; align-items:center; padding:5px 4px; border-radius:8px; width:100%; background:none; border:0; text-align:left}
.cat:hover{background:var(--chip)}
.cat.on{background:var(--chip); outline:1px solid var(--accent)}
.cat .n{font-size:14px}
.cat .bar{height:10px; background:var(--chip); border-radius:5px; overflow:hidden}
.cat.on .bar{background:var(--card)}
.cat .bar i{display:block; height:100%; border-radius:5px}
.cat .a{font-size:14px; text-align:right; min-width:92px}
.cat .a em{font-style:normal; color:var(--mute); font-size:12px; margin-left:4px}

/* daily chart */
.chart{display:flex; align-items:flex-end; gap:2px; height:96px; padding-top:6px}
.chart .col{flex:1; height:100%; display:flex; align-items:flex-end; position:relative; min-width:0}
.chart .col i{display:block; width:100%; background:var(--accent); opacity:.85; border-radius:2px 2px 0 0; min-height:0}
.chart .col.zero i{background:var(--line); height:2px!important}
.chart .col.max i{background:var(--out); opacity:1}
.axis{display:flex; gap:2px; margin-top:4px; font-size:10px; color:var(--mute)}
.axis span{flex:1; text-align:center; overflow:visible; white-space:nowrap; min-width:0}

/* trend */
.trend{display:flex; gap:6px; align-items:flex-end; height:110px; overflow-x:auto; padding-bottom:2px}
.tm{flex:1; min-width:36px; height:100%; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:0; border-radius:8px; padding:2px}
.tm:hover{background:var(--chip)}
.tm.on{background:var(--chip); outline:1px solid var(--accent)}
.tm .pair{flex:1; display:flex; align-items:flex-end; gap:3px; width:100%; justify-content:center}
.tm .pair i{display:block; width:42%; max-width:14px; border-radius:2px 2px 0 0}
.tm .pair .o{background:var(--out)} .tm .pair .p{background:var(--in)}
.tm span{font-size:11px; color:var(--mute)}
.legend{display:flex; gap:12px; font-size:12px; color:var(--mute)}
.legend b{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px}

/* methods */
.meth{display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--chip)}
.meth i{display:block; height:100%}
.mlegend{display:flex; gap:16px; flex-wrap:wrap; margin-top:8px; font-size:13px}
.mlegend span b{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px}
.mlegend span em{font-style:normal; color:var(--mute); margin-left:4px}

/* list */
.tools{display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap}
.tools input[type=search]{flex:1; min-width:140px; height:34px; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:0 10px}
.seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg button{border:0; background:none; padding:0 12px; height:32px; color:var(--mute)}
.seg button.on{background:var(--ink); color:var(--card)}
.filt{display:inline-flex; gap:6px; align-items:center; background:var(--chip); border-radius:999px; padding:2px 6px 2px 10px; font-size:13px; margin-bottom:8px}
.filt button{border:0; background:none; color:var(--mute); padding:0 4px; font-size:16px; line-height:1}
summary.day{display:flex; align-items:center; font-size:14px; color:var(--ink); padding:11px 2px; border-bottom:1px solid var(--line); list-style:none; cursor:pointer}
summary.day::-webkit-details-marker{display:none}
summary.day::after{content:"›"; color:var(--mute); font-size:18px; line-height:1; transition:transform .15s; margin-left:8px}
details.dayg[open]>summary.day::after{transform:rotate(90deg)}
summary.day span.l{flex:1; font-weight:600}
summary.day span.n2{color:var(--mute); font-size:13px}
details.dayg[open]>summary.day{margin-bottom:0}
.todayhint{color:var(--mute); font-size:13px; padding:10px 2px}
.row{display:grid; grid-template-columns:10px 1fr auto; gap:10px; align-items:center; padding:9px 2px; border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.dot{width:8px; height:8px; border-radius:50%}
.row .t{min-width:0}
.row .t b{font-weight:500; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .t small{color:var(--mute); font-size:12px}
.row .m{font-weight:600; text-align:right}
.x{display:inline-block; font-size:10px; font-weight:700; background:var(--chip); color:var(--out); border-radius:4px; padding:0 4px; margin-left:6px; vertical-align:1px}
.more{display:block; width:100%; margin-top:10px; height:36px; border:1px solid var(--line); background:var(--bg); border-radius:8px}
.empty,.status{color:var(--mute); text-align:center; padding:24px 0}
.foot{text-align:center; color:var(--mute); font-size:12px; margin-top:16px}

/* 密碼畫面 */
.gate{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 18px; margin-top:24px; text-align:center}
.gate h2{margin:0 0 4px; font-size:18px}
.gate p{margin:0 0 14px; color:var(--mute); font-size:13px}
.gate input{width:100%; height:46px; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:0 12px; font-size:16px; text-align:center}
.gate button{width:100%; height:46px; margin-top:12px; border:0; border-radius:10px; background:#f5c400; color:#111; font-size:16px; font-weight:700}
.gate .gerr{color:var(--out); font-size:13px; min-height:18px; margin-top:8px}
/* 記一筆 */
.wrap{padding-bottom:96px}
#fab{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); width:56px; height:56px; border-radius:50%; border:0; background:#f5c400; color:#111; font-size:32px; line-height:1; box-shadow:0 4px 14px rgba(0,0,0,.35); z-index:20}
#fab:active{transform:scale(.95)}
#ov{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30; display:flex; align-items:flex-end; justify-content:center}
#ov[hidden]{display:none}
#ov,#sheet{overscroll-behavior:contain}
html.lock,body.lock{overflow:hidden; height:100%}
body.lock{position:fixed; left:0; right:0; width:100%}
#sheet{background:var(--card); width:100%; max-width:760px; border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px)); max-height:92vh; overflow-y:auto}
.sh-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
.sh-head b{font-size:17px}
.sh-head button{border:0; background:var(--chip); width:32px; height:32px; border-radius:50%; font-size:18px; color:var(--mute)}
#sheet label.l{display:block; font-size:12px; color:var(--mute); margin:12px 0 6px}
#sheet input[type=number],#sheet input[type=text]{width:100%; height:44px; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:0 12px; font-size:16px}
#sheet input#f-amt{height:54px; font-size:28px; font-weight:700}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips button{border:1px solid var(--line); background:var(--bg); border-radius:999px; height:38px; padding:0 14px; display:inline-flex; align-items:center; gap:6px; font-size:15px}
.chips button.on{background:var(--ink); color:var(--card); border-color:var(--ink)}
.chips button i{width:8px; height:8px; border-radius:50%; display:inline-block}
#sheet .seg button{flex:1; height:38px; font-size:15px}
.xrow{display:flex; align-items:center; gap:8px; margin-top:14px; font-size:15px; cursor:pointer}
.xrow input{width:20px; height:20px}
.send{width:100%; height:50px; margin-top:16px; border:0; border-radius:12px; background:#f5c400; color:#111; font-size:17px; font-weight:700}
.send:disabled{opacity:.5}
.err{color:var(--out); font-size:13px; min-height:18px; margin-top:8px}
#toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--card); padding:8px 16px; border-radius:999px; font-size:14px; z-index:40; opacity:0; pointer-events:none; transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>吃土專區</h1>
    <span class="upd" id="upd"></span>
  </div>
  <div class="ctrl">
    <button class="ico" id="prev" aria-label="上個月">‹</button>
    <button class="monthbtn" id="monthbtn" aria-label="選擇月份"></button>
    <button class="ico" id="next" aria-label="下個月">›</button>
    <button class="ico" id="reload" aria-label="重新載入">↻</button>
    <div id="mpbk" hidden></div>
    <div id="mp" hidden></div>
  </div>
  <div id="app"><div class="status">載入中…</div></div>
</div>

<button id="fab" aria-label="記一筆">＋</button>
<div id="ov" hidden><div id="sheet" role="dialog" aria-label="記一筆"></div></div>
<div id="toast"></div>

<script>
// ====== 設定：Apps Script 網頁應用程式網址（結尾是 /exec）======
// 這個網址本身不含任何資料；沒有密碼的人打不開任何東西。
const API_URL = "https://script.google.com/macros/s/AKfycbw_Nd8R7l-3rNeS4mXVyOMeb43iATlAoZbnf8GcPWRF_CTGN1HrWdE9zrRUSIlJ9AcA/exec";
// ===========================================================

const CATS = ["飲食","交通","購物","娛樂","生活","投資","還款","薪水","旅遊","其它"];
const METHODS = ["現金","刷卡","轉帳"];

const COLORS = {飲食:"#e08a3c",交通:"#4a8fd6",生活:"#7a6bd1",投資:"#2c9a7f",娛樂:"#d65b9b",購物:"#c9a227",旅遊:"#2fa7b8",還款:"#8a94a3",其它:"#a1805f",薪水:"#12856b"};
const METHOD_COLORS = {刷卡:"#4a8fd6",轉帳:"#7a6bd1",現金:"#e08a3c"};
const PAGE = 40;

let lastLoad=0;
const BUILD="20261123-7";   // 每次改版會更新，用來讓已安裝的網頁App偵測新版
const st = {rows:[], month:null, type:"all", cat:null, q:"", noInv:false, shown:PAGE, tab:null, dayOpen:{}, pending:[]};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n).toLocaleString("en-US");
const pad = n => String(n).padStart(2,"0");
const col = c => COLORS[c] || "#8a94a3";

function mkRow(d,type,method,cat,amt,note,flag){
  return {d, key:`${d.getFullYear()}-${pad(d.getMonth()+1)}`, day:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
    time:`${pad(d.getHours())}:${pad(d.getMinutes())}`, type, method, cat, amt, note, flag};
}
// 伺服器回傳 [時間, 來源, 方式, 用途, 金額, 備註, 注記]；時間可能是毫秒數，或舊資料的文字
function rowsFromApi(list){
  return list.map(r=>{
    let d;
    if(typeof r[0]==="number") d=new Date(r[0]);
    else{
      const m=/(\d+)\/(\d+)\/(\d+)\s*(上午|下午)\s*(\d+):(\d+):(\d+)/.exec(String(r[0]||""));
      if(!m) return null;
      let h=+m[5]; if(m[4]==="下午"&&h<12)h+=12; if(m[4]==="上午"&&h===12)h=0;
      d=new Date(+m[1],+m[2]-1,+m[3],h,+m[6],+m[7]);
    }
    const amt=parseFloat(r[4]); if(isNaN(amt)||isNaN(d)) return null;
    return mkRow(d,String(r[1]||"").trim(),String(r[2]||"").trim(),String(r[3]||"其它").trim(),amt,String(r[5]||"").trim(),String(r[6]||"").trim().toUpperCase()==="X");
  }).filter(Boolean).sort((a,b)=>b.d-a.d);
}

// ===== 與後端溝通（密碼存在這支手機裡，不會出現在網頁原始碼）=====
const getToken=()=>{try{return localStorage.getItem("ledger_token")||""}catch(e){return ""}};
async function api(payload){
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),25000);
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:getToken(),...payload}),signal:ctl.signal});
    const text=await r.text();
    try{ return JSON.parse(text) }
    catch(e){ throw new Error("後端回應不是 JSON（HTTP "+r.status+"）："+text.replace(/\s+/g," ").slice(0,80)) }
  }catch(e){
    if(e.name==="AbortError") throw new Error("連線逾時（25 秒沒有回應）");
    throw e;
  }finally{ clearTimeout(timer) }
}
function showLock(msg){
  $("#fab").style.display="none"; $("#upd").textContent="";
  $("#app").innerHTML=`<form class="gate" id="gate"><h2>請輸入密碼</h2><p>每個裝置只需輸入一次</p>
    <input type="password" id="gpw" autocomplete="current-password" aria-label="密碼">
    <button type="submit">解鎖</button><div class="gerr">${esc(msg||"")}</div></form>`;
  $("#gate").onsubmit=e=>{e.preventDefault(); const v=$("#gpw").value.trim(); if(!v)return;
    try{localStorage.setItem("ledger_token",v)}catch(x){}
    load();};
}

async function load(quiet){
  try{ await loadInner(quiet) }
  catch(e){ $("#app").innerHTML='<div class="status">發生錯誤：'+esc(e.message||e)+'</div>' }
}
async function loadInner(quiet){
  if(API_URL.startsWith("__")){ $("#app").innerHTML='<div class="status">尚未設定 API 網址</div>'; return }
  if(!getToken()){ showLock(); return }
  if(!quiet) $("#app").innerHTML='<div class="status">載入中…</div>';
  let list, meta=null, cached=false, why="";
  try{
    const j=await api({action:"list"});
    if(!j.ok){
      if(j.error==="auth"){ try{localStorage.removeItem("ledger_token")}catch(e){}; showLock("密碼錯誤，請重新輸入"); return }
      throw new Error(j.error||"unknown");
    }
    list=j.rows; meta=j.meta||null;
    try{ localStorage.setItem("ledger_rows",JSON.stringify(list)); localStorage.setItem("ledger_at",Date.now()) }catch(e){}
  }catch(e){
    why=String(e.message||e);
    try{ list=JSON.parse(localStorage.getItem("ledger_rows")||"null"); cached=!!list }catch(e2){}
    if(!list){ $("#app").innerHTML='<div class="status">無法讀取資料<br><small>'+esc(why)+'</small></div>'; return }
  }
  $("#fab").style.display="";
  if(cached && !quiet) toast("連線失敗，顯示離線資料："+why.slice(0,40));
  const apiRows = rowsFromApi(list);
  st.pending = st.pending.filter(p=>Date.now()-p.at<10*60e3 && !apiRows.some(r=>
    r.type===p.type && r.cat===p.cat && r.method===p.method && r.amt===p.amt && r.note===p.note && Math.abs(r.d-p.d)<10*60e3));
  st.rows = [...st.pending, ...apiRows].sort((a,b)=>b.d-a.d);
  const months=[...new Set(st.rows.map(r=>r.key))];
  if(!months.length){
    $("#app").innerHTML='<div class="status">連線成功，但沒有讀到任何帳目。'+(meta?`<br><small>檔案「${esc(meta.file)}」・分頁「${esc(meta.sheet)}」・列數 ${esc(meta.lastRow)}<br>所有分頁：${esc((meta.sheets||[]).join("、"))}</small>`:"")+'</div>';
    return;
  }
  if(!st.month || !months.includes(st.month)) st.month = months[0];
  let at=Date.now(); if(cached){ try{ at=+localStorage.getItem("ledger_at")||at }catch(e){} }
  const u=new Date(at);
  $("#upd").textContent = (cached?"離線資料　":"")+"更新 "+(u.getMonth()+1)+"/"+u.getDate()+" "+pad(u.getHours())+":"+pad(u.getMinutes());
  lastLoad=Date.now();
  const y=window.scrollY; render(); if(quiet) window.scrollTo(0,y);
}

function render(){
  const base = st.rows.filter(r=>!(st.noInv && r.cat==="投資"));
  const months=[...new Set(st.rows.map(r=>r.key))]; // desc
  $("#monthbtn").textContent = `${st.month.slice(0,4)}年${+st.month.slice(5)}月 ▾`;
  const mi=months.indexOf(st.month);
  $("#next").disabled = mi<=0; $("#prev").disabled = mi>=months.length-1;

  const mr = base.filter(r=>r.key===st.month);
  const exp = mr.filter(r=>r.type==="支出"), inc = mr.filter(r=>r.type==="收入");
  const sum = a => a.reduce((s,r)=>s+r.amt,0);
  const E=sum(exp), I=sum(inc), B=I-E;

  // categories (expense)
  const cats={}; exp.forEach(r=>cats[r.cat]=(cats[r.cat]||0)+r.amt);
  const catList=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const maxC=catList[0]?catList[0][1]:1;

  // daily
  const [y,mo]=st.month.split("-").map(Number);
  const days=new Date(y,mo,0).getDate();
  const daily=Array(days).fill(0); exp.forEach(r=>daily[r.d.getDate()-1]+=r.amt);
  const maxD=Math.max(...daily,1), maxIdx=daily.indexOf(Math.max(...daily));
  const spendDays = new Date().getFullYear()===y && new Date().getMonth()+1===mo ? new Date().getDate() : days;
  const avg = E/Math.max(spendDays,1);

  // trend (last 12 months, oldest->newest)
  const tm = months.slice(0,12).reverse().map(k=>{
    const rs=base.filter(r=>r.key===k);
    return {k, e:sum(rs.filter(r=>r.type==="支出")), i:sum(rs.filter(r=>r.type==="收入"))};
  });
  const maxT=Math.max(...tm.flatMap(t=>[t.e,t.i]),1);

  // methods
  const mm={}; exp.forEach(r=>mm[r.method]=(mm[r.method]||0)+r.amt);
  const mList=Object.entries(mm).sort((a,b)=>b[1]-a[1]);

  // flagged list
  const xr = exp.filter(r=>r.flag), xs = sum(xr);
  // flagged
  const X = sum(exp.filter(r=>r.flag));

  const html = `
  <div class="hero">
    <div class="lbl">本月支出</div>
    <div class="big">$${fmt(E)}</div>
    <div class="sub">
      <div><div class="lbl">本月收入</div><div class="v pos">$${fmt(I)}</div></div>
    </div>
  </div>
  <div class="opt">
    <label><input type="checkbox" id="noinv" ${st.noInv?"checked":""}> 不計「投資」</label>
  </div>

  <div class="tabbar" role="tablist">
    ${[["cat","支出用途"],["daily","每日支出"],["trend","近12個月"],["meth","支付方式"],["x","X"]].map(([k,l])=>`<button role="tab" data-tab="${k}" class="${st.tab===k?"on":""}" aria-selected="${st.tab===k}">${l}</button>`).join("")}
  </div>
  <div class="pane" data-k="cat" ${st.tab==="cat"?"":"hidden"}>
    <div class="hint">點選可篩選明細</div>
    ${catList.length? catList.map(([c,v])=>`
      <button class="cat ${st.cat===c?"on":""}" data-cat="${esc(c)}">
        <span class="n">${esc(c)}</span>
        <span class="bar"><i style="width:${v/maxC*100}%;background:${col(c)}"></i></span>
        <span class="a">$${fmt(v)}<em>${(v/E*100).toFixed(0)}%</em></span>
      </button>`).join("") : '<div class="empty">本月沒有支出</div>'}
  </div>

  <div class="pane" data-k="daily" ${st.tab==="daily"?"":"hidden"}>
    <div class="hint">${E?`最高 ${mo}/${maxIdx+1} $${fmt(daily[maxIdx])}`:""}</div>
    <div class="chart">
      ${daily.map((v,i)=>`<div class="col ${v===0?"zero":""} ${v&&i===maxIdx?"max":""}" title="${mo}/${i+1}：$${fmt(v)}"><i style="height:${v/maxD*100}%"></i></div>`).join("")}
    </div>
    <div class="axis">${daily.map((_,i)=>`<span>${(i+1)%5===1||i===days-1&&false?i+1:""}</span>`).join("")}</div>
  </div>

  <div class="pane" data-k="trend" ${st.tab==="trend"?"":"hidden"}>
    <div class="hint"><span><b style="background:var(--out)"></b>支出</span><span><b style="background:var(--in)"></b>收入</span></div>
    <div class="trend">
      ${tm.map(t=>`<button class="tm ${t.k===st.month?"on":""}" data-m="${t.k}" title="支出 $${fmt(t.e)}／收入 $${fmt(t.i)}">
        <div class="pair"><i class="o" style="height:${t.e/maxT*100}%"></i><i class="p" style="height:${t.i/maxT*100}%"></i></div>
        <span>${+t.k.slice(5)}月</span></button>`).join("")}
    </div>
  </div>

  <div class="pane" data-k="meth" ${st.tab==="meth"?"":"hidden"}>
    ${!mList.length?'<div class="empty">本月沒有支出</div>':""}
    <div class="meth">${mList.map(([m,v])=>`<i style="width:${v/E*100}%;background:${METHOD_COLORS[m]||"#8a94a3"}"></i>`).join("")}</div>
    <div class="mlegend">${mList.map(([m,v])=>`<span><b style="background:${METHOD_COLORS[m]||"#8a94a3"}"></b>${esc(m)} $${fmt(v)}<em>${(v/E*100).toFixed(0)}%</em></span>`).join("")}</div>
  </div>

  <div class="pane" data-k="x" ${st.tab==="x"?"":"hidden"}>
    ${xr.length?`<div class="xsum"><b>$${fmt(xs)}</b><span>${xr.length} 筆・占支出 ${(xs/E*100).toFixed(0)}%</span></div>`+
      xr.map(r=>`<div class="row"><span class="dot" style="background:${col(r.cat)}"></span>
        <div class="t"><b>${esc(r.note||r.cat)}</b><small>${r.d.getMonth()+1}/${r.d.getDate()} ${r.time}・${esc(r.cat)}・${esc(r.method)}</small></div>
        <div class="m neg">$${fmt(r.amt)}</div></div>`).join(""):'<div class="empty">本月沒有 X</div>'}
  </div>

  <section>
    <h2>明細 <small id="cnt"></small></h2>
    <div class="tools">
      <input type="search" id="q" placeholder="搜尋全部月份（備註、用途）" value="${esc(st.q)}">
      <div class="seg">${[["all","全部"],["支出","支出"],["收入","收入"]].map(([v,l])=>`<button data-type="${v}" class="${st.type===v?"on":""}">${l}</button>`).join("")}</div>
    </div>
    ${st.cat?`<div class="filt">用途：${esc(st.cat)}<button id="clrcat" aria-label="清除篩選">×</button></div>`:""}
    <div id="list"></div>
  </section>`;
  $("#app").innerHTML = html;
  renderList();
  bind();
}

function renderList(){
  const q=st.q.trim().toLowerCase();
  const pool=st.rows.filter(r=>!(st.noInv && r.cat==="投資"));
  const mr = q ? pool : pool.filter(r=>r.key===st.month);   // 有搜尋字時跨所有月份
  const LIMIT=200;
  let rows = mr.filter(r=>
    (st.type==="all"||r.type===st.type) &&
    (!st.cat || r.cat===st.cat) &&
    (!q || (r.note+r.cat+r.method).toLowerCase().includes(q)));
  const total=rows.length; if(rows.length>LIMIT) rows=rows.slice(0,LIMIT);
  $("#cnt").textContent = q ? `全部月份 ${total} 筆` : total+" 筆";
  const now=new Date(), today=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const isCur = st.month===today.slice(0,7);
  const groups=[]; rows.forEach(r=>{ const g=groups[groups.length-1]; if(g&&g.day===r.day)g.items.push(r); else groups.push({day:r.day,items:[r]}) });
  if(!q && isCur && !groups.some(g=>g.day===today)) groups.unshift({day:today,items:[]});
  if(!groups.length){ $("#list").innerHTML='<div class="empty">沒有符合的紀錄</div>'; return }
  const wk="日一二三四五六", filtering=!!(q||st.cat);
  $("#list").innerHTML = groups.map(g=>{
    const dt=new Date(g.day.replace(/-/g,"/"));
    const net=g.items.reduce((s,r)=>s+(r.type==="收入"?r.amt:-r.amt),0);
    const open = filtering ? true : (g.day in st.dayOpen ? st.dayOpen[g.day] : g.day===today);
    const label = `${q?dt.getFullYear()+"/":""}${dt.getMonth()+1}/${dt.getDate()}（${wk[dt.getDay()]}）${g.day===today?" 今天":""}`;
    return `<details class="dayg" data-day="${g.day}" ${open?"open":""}>
      <summary class="day"><span class="l">${label}</span><span class="n2">${g.items.length?`${g.items.length} 筆　${net<0?"−":"+"}$${fmt(Math.abs(net))}`:"尚無紀錄"}</span></summary>`+
      (g.items.length? g.items.map(r=>`<div class="row">
        <span class="dot" style="background:${col(r.cat)}"></span>
        <div class="t"><b>${esc(r.note||r.cat)}${r.flag?'<span class="x">X</span>':""}${r.pending?'<span class="x" style="color:var(--mute)">同步中</span>':""}</b><small>${r.time}・${esc(r.cat)}・${esc(r.method)}</small></div>
        <div class="m ${r.type==="收入"?"pos":"neg"}">${r.type==="收入"?"+":""}$${fmt(r.amt)}</div></div>`).join("") : '<div class="todayhint">今天還沒有記帳</div>')+
      `</details>`;
  }).join("");
  if(total>LIMIT) $("#list").insertAdjacentHTML("beforeend",`<div class="todayhint">僅顯示最新 ${LIMIT} 筆，請輸入更精確的關鍵字</div>`);
  document.querySelectorAll("details.dayg").forEach(d=>d.addEventListener("toggle",()=>{ if(!filtering) st.dayOpen[d.dataset.day]=d.open }));
}

function bind(){
  const mr=()=>st.rows.filter(r=>r.key===st.month && !(st.noInv&&r.cat==="投資"));
  document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>{st.tab=st.tab===b.dataset.tab?null:b.dataset.tab; render()});
  document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{st.cat=st.cat===b.dataset.cat?null:b.dataset.cat; st.shown=PAGE; render()});
  document.querySelectorAll(".tm").forEach(b=>b.onclick=()=>{st.month=b.dataset.m; st.cat=null; st.shown=PAGE; render()});
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{st.type=b.dataset.type; st.shown=PAGE; render()});
  const c=$("#clrcat"); if(c) c.onclick=()=>{st.cat=null; render()};
  $("#noinv").onchange=e=>{st.noInv=e.target.checked; render()};
  $("#q").oninput=e=>{st.q=e.target.value; st.shown=PAGE; renderList()};
}

const months=()=>[...new Set(st.rows.map(r=>r.key))];
// ===== 月份選擇器 =====
let pickY=0;
function drawPicker(){
  const ks=months(), set=new Set(ks), ys=ks.map(k=>+k.slice(0,4));
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  $("#mp").innerHTML=`
    <div class="mp-head"><button type="button" id="mpp" ${pickY<=minY?"disabled":""} aria-label="上一年">‹</button><b>${pickY} 年</b><button type="button" id="mpn" ${pickY>=maxY?"disabled":""} aria-label="下一年">›</button></div>
    <div class="mp-grid">${Array.from({length:12},(_,i)=>{const k=`${pickY}-${pad(i+1)}`; return `<button type="button" data-k="${k}" ${set.has(k)?"":"disabled"} class="${k===st.month?"on":""}">${i+1}月</button>`}).join("")}</div>`;
  $("#mpp").onclick=()=>{pickY--; drawPicker()};
  $("#mpn").onclick=()=>{pickY++; drawPicker()};
  $("#mp").querySelectorAll(".mp-grid button").forEach(b=>b.onclick=()=>{st.month=b.dataset.k; st.cat=null; st.shown=PAGE; closePicker(); render()});
}
function openPicker(){ if(!st.rows.length) return; pickY=+st.month.slice(0,4); drawPicker(); $("#mp").hidden=false; $("#mpbk").hidden=false }
function closePicker(){ $("#mp").hidden=true; $("#mpbk").hidden=true }
$("#monthbtn").onclick=()=>{ $("#mp").hidden ? openPicker() : closePicker() };
$("#mpbk").onclick=closePicker;
// ===== 自動更新：回到 App 時重新載入資料，並偵測是否有新版 =====
async function checkVersion(){
  try{
    const r=await fetch(location.pathname+"?_="+Date.now(),{cache:"no-store"});
    const m=/const BUILD="([^"]+)"/.exec(await r.text());
    if(m && m[1]>BUILD){ location.replace(location.pathname+"?v="+m[1]); return true }
  }catch(e){}
  return false;
}
document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState!=="visible") return;
  if(await checkVersion()) return;
  const busy = !$("#ov").hidden || (document.activeElement && document.activeElement.id==="q");
  if(!busy && Date.now()-lastLoad>30000) load(true);
});
$("#prev").onclick=()=>{const m=months(),i=m.indexOf(st.month); if(i<m.length-1){st.month=m[i+1]; st.cat=null; st.shown=PAGE; render()}};
$("#next").onclick=()=>{const m=months(),i=m.indexOf(st.month); if(i>0){st.month=m[i-1]; st.cat=null; st.shown=PAGE; render()}};
$("#reload").onclick=load;
// ===== 記一筆 =====
const f = {type:"支出", method:(()=>{try{return localStorage.getItem("ledger_method")}catch(e){return null}})()||"刷卡", cat:null, flag:false};
function toast(t){const el=$("#toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2200)}
function chips(id,list,cur,withDot){return `<div class="chips" id="${id}">`+list.map(v=>`<button type="button" data-v="${v}" class="${v===cur?"on":""}">${withDot?`<i style="background:${col(v)}"></i>`:""}${v}</button>`).join("")+"</div>"}
function openSheet(){
  f.cat=null; f.flag=false; f.type="支出";
  $("#sheet").innerHTML=`
    <div class="sh-head"><b>記一筆</b><button type="button" id="shx" aria-label="關閉">×</button></div>
    <div class="seg" id="g-type">${["支出","收入"].map(v=>`<button type="button" data-v="${v}" class="${v===f.type?"on":""}">${v}</button>`).join("")}</div>
    <label class="l" for="f-amt">金額</label>
    <input id="f-amt" type="number" inputmode="decimal" step="any" min="0" placeholder="0">
    <label class="l">用途</label>${chips("g-cat",CATS,f.cat,true)}
    <label class="l">方式</label>${chips("g-method",METHODS,f.method,false)}
    <label class="l" for="f-note">備註</label>
    <input id="f-note" type="text" placeholder="選填" autocomplete="off">
    <label class="xrow"><input type="checkbox" id="f-x"> 標記 X（非必要）</label>
    <div class="err" id="err"></div>
    <button type="button" class="send" id="send">送出</button>`;
  const pick=(gid,key)=>$(gid).onclick=e=>{const b=e.target.closest("button"); if(!b)return; f[key]=b.dataset.v; $(gid).querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b))};
  pick("#g-type","type"); pick("#g-cat","cat"); pick("#g-method","method");
  $("#shx").onclick=closeSheet; $("#send").onclick=send;
  lockScroll(true);
  $("#ov").hidden=false;
}
let lockY=0;
function lockScroll(on){
  const b=document.body;
  if(on){ if(b.classList.contains("lock"))return; lockY=window.scrollY; b.style.top=`-${lockY}px`; b.classList.add("lock"); document.documentElement.classList.add("lock"); }
  else { if(!b.classList.contains("lock"))return; b.classList.remove("lock"); document.documentElement.classList.remove("lock"); b.style.top=""; window.scrollTo(0,lockY); }
}
function closeSheet(){$("#ov").hidden=true; lockScroll(false)}
async function send(){
  const amt=parseFloat($("#f-amt").value), note=$("#f-note").value.trim(), flag=$("#f-x").checked, err=$("#err");
  if(!(amt>0)){err.textContent="請輸入金額"; return}
  if(!f.cat){err.textContent="請選擇用途"; return}
  err.textContent=""; const btn=$("#send"); btn.disabled=true; btn.textContent="送出中…";
  let j;
  try{
    j=await api({action:"add",type:f.type,method:f.method,cat:f.cat,amt,note,flag});
  }catch(e){
    btn.disabled=false; btn.textContent="送出"; err.textContent="送出失敗，請確認網路後再試"; return;
  }
  if(!j.ok){
    if(j.error==="auth"){ closeSheet(); try{localStorage.removeItem("ledger_token")}catch(e){}; showLock("密碼錯誤或已失效，請重新輸入"); return }
    btn.disabled=false; btn.textContent="送出"; err.textContent="送出失敗："+(j.error||"未知錯誤"); return;
  }
  try{localStorage.setItem("ledger_method",f.method)}catch(e){}
  const row=Object.assign(mkRow(new Date(),f.type,f.method,f.cat,amt,note,flag),{pending:true,at:Date.now()});
  st.pending.unshift(row); st.rows=[row,...st.rows];
  st.month=row.key; st.cat=null; st.q=""; st.type="all";
  closeSheet(); render(); toast("已送出");
  setTimeout(()=>load(true),6000); setTimeout(()=>load(true),20000);
}
// iOS 會無視 overflow:hidden，改用 touchmove 攔截，確保背景不會被帶動
(function(){
  const ov=$("#ov"), sheet=$("#sheet"); let y0=0;
  document.addEventListener("touchstart",e=>{y0=e.touches[0].clientY},{passive:true,capture:true});
  document.addEventListener("touchmove",e=>{
    if(ov.hidden) return;
    if(!sheet.contains(e.target)){ e.preventDefault(); return }            // 點在灰色背景上：一律擋掉
    const scrollable = sheet.scrollHeight > sheet.clientHeight + 1;
    if(!scrollable){ e.preventDefault(); return }                          // 面板不需要捲動：擋掉
    const dy=e.touches[0].clientY-y0, atTop=sheet.scrollTop<=0, atBottom=sheet.scrollTop+sheet.clientHeight>=sheet.scrollHeight-1;
    if((atTop&&dy>0)||(atBottom&&dy<0)) e.preventDefault();               // 面板捲到頭尾：不要傳給背景
  },{passive:false,capture:true});
})();
$("#fab").onclick=openSheet;
$("#ov").onclick=e=>{if(e.target.id==="ov")closeSheet()};

load();
checkVersion();
</script>
</body>
</html>
